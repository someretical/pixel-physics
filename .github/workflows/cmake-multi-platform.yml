name: CMake on multiple platforms

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      force_recompile:
        description: "Ignore cache and recompile"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ matrix.os }}

    env:
      SCCACHE_RECACHE: ${{ inputs.force_recompile == true && '1' || '0' }}
      SCCACHE_GHA_ENABLED: "true"

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-24.04, windows-2025]
        include:
          - os: windows-2025
            c_compiler: clang-cl
            cpp_compiler: clang-cl
          - os: ubuntu-24.04
            c_compiler: clang-18
            cpp_compiler: clang++-18

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Submodules
        shell: bash
        run: |
          # 1. Initialize all submodules
          git submodule init

          # 2. Setup Sparse-Checkout for Boost
          # Note: Use -C to run git commands inside the submodule directory
          git -C dependencies/boost sparse-checkout init --cone
          git -C dependencies/boost sparse-checkout set \
            libs/system libs/config libs/core libs/assert \
            libs/static_assert libs/throw_exception libs/type_traits \
            libs/predef libs/winapi CMakeLists.txt boost-install.cmake

          # 3. Pull Boost (bare minimum)
          git submodule update --init --depth 1 dependencies/boost

          # 4. Pull Dawn (top-level only, NO submodules)
          git submodule update --init --depth 1 dependencies/dawn

          # 5. Pull everything else (recursively)
          # We use forward slashes even on Windows; Git Bash handles the translation
          git submodule update --init --recursive --depth 1 \
            -- ":(exclude)dependencies/boost" \
            -- ":(exclude)dependencies/dawn"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Dawn packages for Linux
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install
          libxrandr-dev
          libxinerama-dev
          libxcursor-dev
          mesa-common-dev
          libx11-xcb-dev
          pkg-config
          nodejs
          npm

      - name: Install SDL packages for Linux
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install
          libasound2-dev
          libjack-jackd2-dev
          libpipewire-0.3-dev
          libpulse-dev
          libsndio-dev
          freeglut3-dev
          libdrm-dev
          libwayland-dev
          libxkbcommon-dev
          libdecor-0-dev
          libudev-dev
          libibus-1.0-dev
          libdbus-1-dev
          libunwind-dev
          libusb-1.0-0-dev
          ninja-build

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        # The reason we use $$GITHUB_WORKSPACE instead of ${{ github.workspace }} is because on windows, the latter returns a path containing backslashes which is bad
        run: |
          echo "build-output-dir=$GITHUB_WORKSPACE/build" >> "$GITHUB_OUTPUT"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -G "Ninja Multi-Config"
          -S ${{ github.workspace }}

      - name: Build Debug
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Debug

      - name: Build Release
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      - name: Build RelWithDebInfo
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config RelWithDebInfo

      - name: Build MinSizeRel
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config MinSizeRel

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: ${{ steps.strings.outputs.build-output-dir }}/bin
